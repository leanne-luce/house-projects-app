<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--cream);color:var(--brown)}.sw{display:flex;gap:0}.chip{flex:1}.box{height:58px}.n{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;margin-top:8px;color:var(--brown-mid)}.v{font-size:0.75rem;color:var(--brown-light);font-family:var(--font-mono);margin-top:2px}</style></head><body>
<div class="sw">
<div class="chip"><div class="box" style="background:#241C10"></div><div class="n">brown</div><div class="v">#241C10 · 14.8:1</div></div>
<div class="chip"><div class="box" style="background:#6F6349"></div><div class="n">brown-mid</div><div class="v">#6F6349 · 5.9:1</div></div>
<div class="chip"><div class="box" style="background:#8A7F63"></div><div class="n">brown-light</div><div class="v">#8A7F63 · 3.6:1</div></div>
<div class="chip"><div class="box" style="background:#9D8B5E"></div><div class="n">brass</div><div class="v">#9D8B5E · accent</div></div>
</div>
<div style="margin-top:14px;font-size:0.9375rem;color:#6F6349;line-height:1.7;max-width:600px">The neutrals share brass's hue, so brass reads as the same family rather than a second colour. Body copy is <b style="font-weight:500;color:#241C10">brown-mid</b>; <b style="font-weight:500;color:#241C10">brown-light</b> is for uppercase labels and meta only, never running text.</div>
</body></html>
